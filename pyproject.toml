[project]
name = "trading-agent"
version = "0.1.0"
description = "Self-improving autonomous trading agent for US30 and BTCUSD"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "yfinance>=0.2.0",
    "ccxt>=4.0.0",
    "alpaca-py>=0.30.0",
    "fredapi>=0.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "ta>=0.11.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
